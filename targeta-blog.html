<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Post Card</title>
    <link href="targeta-blog.css" rel="stylesheet"/>
</head>
<body>
    <div class="blog-post-card">
        <img src="https://cdn.freecodecamp.org/curriculum/labs/cover-photo.jpg" alt="Persona dijitando en un portatil" class="post-img">
        <div class="post-content">
            <h2 class="post-title">Aprenda desarrollo web en 2026</h2>
            <p class="post-excerpt">
                Manténgase a la vanguardia con las últimas tendencias en desarrollo web. Descubra las novedades y novedades de 2026.
            </p>
            <a class="read-more">Read More</a>
        </div>
    </div>
</body>
</html>
